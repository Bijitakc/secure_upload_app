name: Docker CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
      
      - name: Install pip-audit
        run: python -m pip install pip-audit
      
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      
      - name: Prepare test environment
        run: cp .env.test.sample .env.test

      - name: Run tests
        run: |
          docker compose --env-file .env.test \
            -f docker-compose-dev.yml run --rm test

      - name: Build docker image
        run: |
          docker build \
            --target app\
            -t ghcr.io/bijitakc/secure-upload-app:latest \
            -t ghcr.io/bijitakc/secure-upload-app:${{ github.sha }} .
      
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: "v0.76.2"
          image-ref: ghcr.io/bijitakc/secure-upload-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push ghcr.io/bijitakc/secure-upload-app:latest

      - name: Push versioned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push ghcr.io/bijitakc/secure-upload-app:${{ github.sha }}
