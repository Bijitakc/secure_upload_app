apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-alerts
  labels:
    release: prometheus
spec:
  groups:
  - name: flask.application
    rules:
      - alert: FlaskApplicationUnavailable
        expr: up{job="upload-web"} == 0 or absent(up{job="upload-web"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Flask application is unavailable"
          description: "No healthy Flask application targets are being discovered or scraped by Prometheus for more than 2 minutes."
